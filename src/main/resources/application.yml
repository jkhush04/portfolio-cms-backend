server:
  port: 8080

spring:
  application:
    name: cms
  data:
    mongodb:
      # For local dev: mongodb://localhost:27017/portfolio_cms
      # For Atlas (cloud): set MONGODB_URI env var instead
      uri: ${MONGODB_URI:mongodb://localhost:27017/portfolio_cms}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# Custom app properties
app:
  jwt:
    secret: ${JWT_SECRET:}  #at-least-32-chars
    expiration-ms: 86400000   # 24 hours

  admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}


  upload:
    dir: uploads

  mail:
    to: ${CONTACT_NOTIFY_EMAIL:}


  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:5173}

logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: INFO
